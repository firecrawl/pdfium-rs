# Crate releases: tag vX.Y.Z -> verify -> human-gated publish to crates.io
# -> GitHub release.
#
# IMPORTANT: this file's name (publish.yml) is referenced by the crate's
# Trusted Publishing configuration on crates.io (owner: firecrawl, repo:
# pdfium-rs, workflow: publish.yml, environment: release). Renaming it
# breaks publishing until the crates.io config is updated to match.
#
# There are no long-lived secrets anywhere in this pipeline: the publish job
# mints a 30-minute, auto-revoked token via OIDC (rust-lang/
# crates-io-auth-action). The one-time bootstrap for the crate's FIRST
# publish (which cannot use trusted publishing) is documented in
# docs/RELEASING.md.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Never cancel a publish mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before any human gate: prove the tag is coherent and the crate is
  # releasable. Deliberately NOT bound to the `release` environment so a bad
  # tag fails fast without asking a reviewer for approval first.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        run: |
          crate_version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "firecrawl-pdfium") | .version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi
      - name: Fetch pinned PDFium binary
        run: cargo xtask fetch-pdfium
      - name: Test
        run: cargo test --locked --all-targets
      - name: Package dry run
        run: cargo publish --dry-run -p firecrawl-pdfium

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The human gate: the `release` environment is configured in repo
    # settings with required reviewers (and a `v*` deployment tag pattern),
    # so this job blocks until a maintainer approves the run.
    environment: release
    permissions:
      # OIDC token exchange for crates.io trusted publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already on crates.io
        # Makes re-runs safe: if a previous run published but a later step
        # failed, this run must not fail on the duplicate publish. The
        # sparse index path uses the 2-char/2-char prefix rule
        # (fi/re/firecrawl-pdfium); the file is newline-delimited JSON, one
        # object per published version. A 404 (crate not published yet)
        # falls through to publishing.
        id: guard
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSL "https://index.crates.io/fi/re/firecrawl-pdfium" \
            | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "firecrawl-pdfium $version is already published; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint short-lived crates.io token (OIDC)
        if: steps.guard.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish
        if: steps.guard.outputs.published == 'false'
        run: cargo publish -p firecrawl-pdfium
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release (idempotent)
        # Notes come from the CHANGELOG.md section for this version; if the
        # section (or the file) is missing, fall back to --generate-notes
        # rather than failing a release that already shipped to crates.io.
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi
          notes_file=notes.md
          : > "$notes_file"
          if [ -f CHANGELOG.md ]; then
            # Print everything between this version's `## ` heading (either
            # `## [X.Y.Z] - date` or `## X.Y.Z`) and the next `## ` heading.
            awk -v ver="$version" '
              /^## / {
                if (found) exit
                if (index($0, "[" ver "]") > 0 || $2 == ver) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [ -s "$notes_file" ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes_file"
          else
            echo "no CHANGELOG.md section for $version; using generated notes"
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
