# Native binary releases: repackage the pinned, checksum-verified upstream
# PDFium archives into firecrawl-pdfium GitHub release assets.
#
# Triggered by pushing a tag like `native-v7988` (the number tracks the
# pinned upstream chromium/NNNN build), or manually via workflow_dispatch
# for pipeline testing (draft release by default; see docs/RELEASING.md).
#
# What each asset carries (produced by `cargo xtask repackage`):
#   - the upstream archive contents verbatim (lib/, include/, licenses/,
#     LICENSE, VERSION, args.gn) — this satisfies third-party notices,
#   - PROVENANCE.json linking back to the exact upstream release, asset,
#     and sha256 recorded in pdfium.lock.json,
#   - a SHA256SUMS file covering every archive,
# plus, from this workflow: GitHub build-provenance attestations and one
# SPDX SBOM per archive.

name: Release native binaries

run-name: Release native binaries (${{ inputs.tag || github.ref_name }})

on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)release, e.g. native-v7988"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft (pipeline test)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build-provenance attestation (OIDC-signed).
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # For dispatch runs, build from the named tag (not the branch the
          # workflow was dispatched on) so pdfium.lock.json matches the tag.
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Repackage pinned upstream archives
        # Downloads every platform archive, verifies each sha256 against
        # pdfium.lock.json, and writes dist/firecrawl-pdfium-<slug>.tgz plus
        # dist/SHA256SUMS. Refuses to proceed on any checksum mismatch.
        run: cargo xtask repackage --all --tag "$TAG" --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Re-runs of this job (e.g. after a failed attest step) must be
          # able to replace the artifact instead of failing on a name
          # conflict. Archives are byte-reproducible, so this is safe.
          overwrite: true
      - name: Attest build provenance
        # Consumers verify with:
        #   gh attestation verify firecrawl-pdfium-<slug>.tgz --repo firecrawl/pdfium-rs
        # This is the strong supply-chain link for these archives; the SBOMs
        # below are a complement, not the anchor (see the sbom job).
        uses: actions/attest@v4
        with:
          subject-path: "dist/*.tgz"

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # anchore/sbom-action only needs to read; its release auto-upload is
      # disabled below (our own guarded upload in the release job is what
      # attaches SBOMs), so contents stays read-only.
      contents: read
      actions: read
    strategy:
      matrix:
        # Keep in sync with the platforms pinned in pdfium.lock.json.
        slug: [mac-arm64, mac-x64, linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Generate SPDX SBOM for ${{ matrix.slug }}
        # Honest limitation: syft over an archive of opaque shared libraries
        # is thin — it inventories files, not the 14 statically-linked
        # third-party components inside libpdfium. The real upstream linkage
        # is the PROVENANCE.json inside each archive plus the build
        # provenance attestation from the build job.
        uses: anchore/sbom-action@v0
        with:
          file: dist/firecrawl-pdfium-${{ matrix.slug }}.tgz
          format: spdx-json
          output-file: firecrawl-pdfium-${{ matrix.slug }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.slug }}
          path: firecrawl-pdfium-${{ matrix.slug }}.spdx.json
          if-no-files-found: error

  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Compose release notes from pdfium.lock.json
        run: |
          lock=pdfium.lock.json
          upstream_tag=$(jq -r .release "$lock")
          upstream_url="https://github.com/bblanchon/pdfium-binaries/releases/tag/${upstream_tag//\//%2F}"
          {
            echo "Repackaged, checksum-verified PDFium native binaries for \`firecrawl-pdfium\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release tag | \`$TAG\` |"
            echo "| PDFium version | \`$(jq -r .pdfium_version "$lock")\` |"
            echo "| Upstream release | [\`$upstream_tag\`]($upstream_url) |"
            echo
            echo "Each archive contains the upstream build verbatim (\`lib/\`, \`include/\`,"
            echo "\`licenses/\`, \`LICENSE\`, \`VERSION\`, \`args.gn\`) plus \`PROVENANCE.json\`"
            echo "recording the upstream asset and sha256 it was repackaged from."
            echo
            echo "### Release asset sizes"
            echo
            echo "| Bytes | Asset |"
            echo "|---|---|"
            awk -F'\t' '{ printf "| %\047d | `%s` |\n", $1, $2 }' dist/ARTIFACT-SIZES.txt
            echo
            echo "### Upstream archive sha256s (from \`pdfium.lock.json\`, verified at repackage time)"
            echo
            echo "| Platform | Upstream asset | sha256 |"
            echo "|---|---|---|"
            jq -r '.platforms | to_entries[] | "| \(.key) | `\(.value.asset)` | `\(.value.sha256)` |"' "$lock"
            echo
            echo "### Verify what you download"
            echo
            echo '```sh'
            echo "# 1. Checksums (SHA256SUMS is itself an asset of this release):"
            echo "shasum -a 256 -c SHA256SUMS --ignore-missing"
            echo
            echo "# 2. Build provenance (proves the asset was built by this repository's"
            echo "#    release workflow from this tag):"
            echo "gh attestation verify firecrawl-pdfium-<platform>.tgz --repo firecrawl/pdfium-rs"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create release if missing (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; will only (re)upload assets"
          else
            draft_flag=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
              draft_flag="--draft"
            fi
            gh release create "$TAG" --verify-tag $draft_flag \
              --title "PDFium native binaries $TAG" \
              --notes-file notes.md
          fi
      - name: Upload assets (idempotent, tamper-guarded)
        # Byte-reproducible archives make re-runs produce identical bytes,
        # so an already-published .tgz that DIFFERS from this build is an
        # anomaly (lock file changed under the tag, or tampering) — refuse
        # to overwrite it. Metadata assets (SHA256SUMS, sizes, SBOMs) may
        # legitimately be regenerated and are refreshed in place.
        run: |
          mkdir -p .verify
          for f in dist/* sbom/*; do
            name=$(basename "$f")
            if gh release download "$TAG" --pattern "$name" -O ".verify/$name" 2>/dev/null; then
              local_sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
              remote_sha=$(shasum -a 256 ".verify/$name" | cut -d' ' -f1)
              if [ "$local_sha" = "$remote_sha" ]; then
                echo "already published and identical: $name"
                continue
              fi
              case "$name" in
                *.tgz)
                  echo "::error::published $name differs from this build (published sha256 $remote_sha, rebuilt $local_sha). Refusing to overwrite a binary asset consumers may have pinned; delete the asset manually first if the replacement is intentional."
                  exit 1
                  ;;
                *)
                  echo "refreshing metadata asset $name"
                  gh release upload "$TAG" "$f" --clobber
                  ;;
              esac
            else
              gh release upload "$TAG" "$f"
            fi
          done
